<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 12px; color: #1a1a2e; margin: 40px; }
  .header { background: #1a1a2e; color: white; padding: 20px; border-radius: 4px; margin-bottom: 30px; }
  .header h1 { margin: 0; font-size: 20px; }
  .section { margin-bottom: 24px; }
  .section h2 { font-size: 14px; border-bottom: 2px solid #1a1a2e; padding-bottom: 4px; margin-bottom: 12px; }
  .footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid #ddd; font-size: 10px; color: #999; }
</style>
</head>
<body>
<div class="header">
  <h1>ShadowGuard Intelligence Platform</h1>
  <p style="margin:4px 0 0;font-size:11px;opacity:0.75">{{ title }} | Report ID: {{ report_id }} | {{ generated_at_fmt }}</p>
</div>
<div class="section">
  <h2>Analysis Results</h2>
  <p>Module: <strong>{{ module_id | upper }}</strong></p>
</div>
<div class="footer">
  <p>ShadowGuard Intelligence Platform — Authorized investigative use only.</p>
</div>
</body>
</html>
