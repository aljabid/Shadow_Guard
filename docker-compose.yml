version: '3.9'

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    networks:
      - shadowguard-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - shadowguard-net

  celery_worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info -Q default,kolkhoz,droper,piramida,shadowbet --concurrency=4
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    networks:
      - shadowguard-net

  celery_beat:
    build: ./backend
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - shadowguard-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shadowguard}
      POSTGRES_USER: ${POSTGRES_USER:-shadowguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadowguard_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - shadowguard-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shadowguard-net

  elasticsearch:
    image: elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./infra/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
    networks:
      - shadowguard-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-shadowguard}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-shadowguard_minio_dev}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - shadowguard-net

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh /init-buckets.sh
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-shadowguard}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-shadowguard_minio_dev}
    networks:
      - shadowguard-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - shadowguard-net

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:

networks:
  shadowguard-net:
    driver: bridge
