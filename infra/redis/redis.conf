# ShadowGuard Redis Configuration

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no

# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Security
protected-mode no

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Performance
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
