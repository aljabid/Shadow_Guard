apiVersion: v1
kind: ConfigMap
metadata:
  name: shadowguard-config
  namespace: shadowguard
data:
  APP_ENV: "production"
  APP_NAME: "ShadowGuard"
  APP_VERSION: "1.0.0"
  POSTGRES_HOST: "shadowguard-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "shadowguard"
  REDIS_URL: "redis://shadowguard-redis:6379/0"
  CELERY_BROKER_URL: "redis://shadowguard-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://shadowguard-redis:6379/2"
  ELASTICSEARCH_URL: "http://shadowguard-elasticsearch:9200"
  MINIO_ENDPOINT: "shadowguard-minio:9000"
  MINIO_BUCKET: "evidence-packages"
  ALLOWED_ORIGINS: '["https://shadowguard.afm.kz"]'
