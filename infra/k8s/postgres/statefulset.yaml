apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shadowguard-postgres
  namespace: shadowguard
spec:
  serviceName: shadowguard-postgres
  replicas: 1
  selector:
    matchLabels:
      app: shadowguard-postgres
  template:
    metadata:
      labels:
        app: shadowguard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shadowguard
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shadowguard-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shadowguard-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shadowguard-postgres
  namespace: shadowguard
spec:
  selector:
    app: shadowguard-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
